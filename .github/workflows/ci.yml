# Continuous integration (OPS-0002; extended by HD-0021). The token is read-only: no secret, no write permission, no deployment, no hosted service.
# Since HD-0021 the job also installs packages on its own throw-away runner (sudo apt-get, a pinned Playwright and its browser) and runs the
# database and browser regression suites against PostgreSQL servers that the tests start and delete themselves.
# The shape of this file is enforced by ops/lib/workflow-safety.mjs against policy.workflow_policy (run by `npm run ops:validate`).
name: CI

on:
  push:
    branches:
      - "claude/**"
      - claude-dev
  pull_request:
    branches:
      - claude-dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Guard - no provider credential in this job
        run: test -z "${ANTHROPIC_API_KEY:-}${ANTHROPIC_AUTH_TOKEN:-}"
      - name: Install dependencies without running install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Validate project memory and workflows
        run: npm run ops:validate
      - name: Run the operations tests
        run: npm run ops:test
      - name: Install the pinned browser test tool for this job only (not saved to package.json or the lockfile)
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.63.0
      - name: Install the browser and its system libraries
        run: npx playwright install --with-deps chromium
      - name: Make sure the PostgreSQL server programs the database tests start for themselves are present
        run: sudo apt-get install -y --no-install-recommends postgresql-16
      - name: Database, gateway and accounting regression suites (disposable local PostgreSQL, no hosted service)
        run: npm run test:db
      - name: Browser regression suites (real browser, local emulator)
        run: npm run test:browser
      - name: Build
        run: npm run build
